services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: footage_user
      POSTGRES_PASSWORD: footage_pass
      POSTGRES_DB: footage_downloader
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  pgdata:
